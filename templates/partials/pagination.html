{% if page_obj.has_other_pages %}<nav class="pagination-bar" aria-label="Product pages">{% if page_obj.has_previous %}<a href="?{{ query_string }}&amp;page={{ page_obj.previous_page_number }}" aria-label="Previous page">←</a>{% endif %}{% for num in page_obj.paginator.page_range %}<a href="?{{ query_string }}&amp;page={{ num }}" {% if num == page_obj.number %}aria-current="page" class="selected"{% endif %}>{{ num }}</a>{% endfor %}{% if page_obj.has_next %}<a href="?{{ query_string }}&amp;page={{ page_obj.next_page_number }}" aria-label="Next page">→</a>{% endif %}</nav>{% endif %}
