{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Discover unique handmade products and independent artisans at Handcrafted Marketplace.">
<title>{% block title %}Handcrafted Marketplace{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="announcement">Beautiful things, made by real people.</div>{% include 'partials/navbar.html' %}<main id="main" class="container main-content">{% include 'partials/messages.html' %}{% block content %}{% endblock %}</main>{% include 'partials/footer.html' %}<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer>
</script>
<script src="{% static 'js/site.js' %}" defer>
</script>
</body>
</html>
